let lang='fr', cat='all', q='';

function buildFilters(){
  const f=document.getElementById('filters');
  const l=ui[lang];
  f.innerHTML=`<button class="fbtn active" data-cat="all">${l.all}</button>`+
    l.cats.map(c=>`<button class="fbtn" data-cat="${c}">${c}</button>`).join('');
  f.querySelectorAll('.fbtn').forEach(b=>{
    b.addEventListener('click',()=>{
      f.querySelectorAll('.fbtn').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');cat=b.dataset.cat;render();
    });
  });
}

function render(){
  const l=ui[lang];
  document.getElementById('main-title').textContent=l.title;
  document.getElementById('search').placeholder=l.search;
  document.getElementById('empty').textContent=l.empty;
  const s=q.toLowerCase();
  const filtered=wines.filter(w=>{
    const d=w[lang];
    const catOk=cat==='all'||d.cat===cat;
    const txtOk=!s||w.title.toLowerCase().includes(s)||w.region.toLowerCase().includes(s)||w.grape.toLowerCase().includes(s)||d.notes.toLowerCase().includes(s);
    return catOk&&txtOk;
  });
  document.getElementById('count').textContent=l.count(filtered.length);
  const grid=document.getElementById('grid');
  grid.innerHTML=filtered.map(w=>{
    const d=w[lang];
    return`<div class="card"><div class="card-head"><div class="card-title">${w.title}</div><span class="badge ${badgeClass[d.cat]||'b-blanc'}">${d.cat}</span></div><div class="region">${w.region}</div><div class="notes">${d.notes}</div><div class="grape">${w.grape}</div></div>`;
  }).join('');
  grid.style.display=filtered.length?'grid':'none';
  document.getElementById('empty').style.display=filtered.length?'none':'block';
}

document.querySelectorAll('.lang-btn').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.lang-btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    lang=b.dataset.lang;
    cat='all';
    q='';
    document.getElementById('search').value='';
    buildFilters();
    render();
  });
});
document.getElementById('search').addEventListener('input',e=>{q=e.target.value;render();});

buildFilters();
render();
