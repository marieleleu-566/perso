const bc={Blanc:'b-blanc',Rouge:'b-rouge',Rosé:'b-rose',Orange:'b-orange',Pétillant:'b-petillant','Pét-nat':'b-petnat'};
const grid=document.getElementById('grid');
const countEl=document.getElementById('count');
const emptyEl=document.getElementById('empty');
let cat='all',q='';

function render(){
  const s=q.toLowerCase();
  const f=wines.filter(w=>(cat==='all'||w.cat===cat)&&(!s||w.title.toLowerCase().includes(s)||w.region.toLowerCase().includes(s)||w.grape.toLowerCase().includes(s)||w.notes.toLowerCase().includes(s)));
  grid.innerHTML=f.map(w=>`<div class="card"><div class="card-head"><div class="card-title">${w.title}</div><span class="badge ${bc[w.cat]||'b-blanc'}">${w.cat}</span></div><div class="region">${w.region}</div><div class="notes">${w.notes}</div><div class="grape">${w.grape}</div></div>`).join('');
  countEl.textContent=f.length+' vin'+(f.length>1?'s':'');
  emptyEl.style.display=f.length?'none':'block';
  grid.style.display=f.length?'grid':'none';
}

document.querySelectorAll('.fbtn').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.fbtn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');cat=b.dataset.cat;render();
  });
});
document.getElementById('search').addEventListener('input',e=>{q=e.target.value;render();});
render();
</script>
</body>
</html>
